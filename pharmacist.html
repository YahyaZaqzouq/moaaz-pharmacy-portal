<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_pharmacist">بيانات الصيادلة — صيدلية معاذ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html" data-i18n="backLink">→ رجوع للرئيسية</a>

  <div class="topbar">
    <img src="logo.jpg" alt="Moaz Pharmacy" class="logo-img">
    <div class="titles">
      <h1 class="page-title" data-i18n="pageHeading_pharmacist">بيانات الصيادلة</h1>
    </div>
    <button class="lang-toggle" id="langToggle">English</button>
  </div>

  <div class="card">
    <div class="eyebrow" data-i18n="formEyebrow">تسجيل / تحديث البيانات</div>
    <div class="hint" data-i18n="hint_resubmit" style="margin-bottom:16px">لو سبق وسجلت بياناتك، وابعتها تاني بنفس رقم الهوية، هتستبدل القديمة تلقائي بالجديدة.</div>

    <label data-i18n="label_fullName">الاسم رباعي</label>
    <input type="text" id="fullName" data-i18n-placeholder="ph_fullName" placeholder="الاسم الأول الأب الجد العائلة">

    <div class="field-row">
      <div>
        <label data-i18n="label_nationality">الجنسية</label>
        <input type="text" id="nationality" data-i18n-placeholder="ph_nationality" placeholder="مثال: سعودي">
      </div>
      <div>
        <label data-i18n="label_branchNumber">رقم الفرع</label>
        <input type="text" id="branchNumber" inputmode="numeric" data-i18n-placeholder="ph_branchNumber" placeholder="مثال: 29">
      </div>
    </div>

    <label data-i18n="label_idNumber">رقم الهوية / الإقامة</label>
    <input type="text" id="idNumber" inputmode="numeric" data-i18n-placeholder="ph_idNumber" placeholder="مثال: 1023456789">

    <label data-i18n="label_licenseNumber">رقم التسجيل المهني</label>
    <input type="text" id="licenseNumber" data-i18n-placeholder="ph_licenseNumber" placeholder="رقم التسجيل المهني">

    <label data-i18n="label_licenseExpiry">تاريخ انتهاء التسجيل المهني</label>
    <input type="date" id="licenseExpiry">

    <label data-i18n="label_mobile">رقم الجوال</label>
    <input type="tel" id="mobile" data-i18n-placeholder="ph_mobile" placeholder="05XXXXXXXX">

    <label data-i18n="label_workHours">عدد ساعات العمل</label>
    <input type="text" id="workHours" inputmode="numeric" data-i18n-placeholder="ph_workHours" placeholder="مثال: 8">

    <div class="actions">
      <button class="btn btn-primary btn-block" id="saveBtn" data-i18n="saveBtn">حفظ البيانات</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </div>

</div>

<script type="module">
import { db, doc, setDoc, serverTimestamp } from "./firebase-config.js";
import { initLangToggle, getLang, dict } from "./i18n.js";

initLangToggle();

const formMsg = document.getElementById('formMsg');

function showMsg(text, ok){
  formMsg.textContent = text;
  formMsg.className = 'msg show ' + (ok ? 'ok' : 'err');
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const lang = getLang();
  const t = dict[lang];
  const id = document.getElementById('idNumber').value.trim();
  const data = {
    fullName: document.getElementById('fullName').value.trim(),
    nationality: document.getElementById('nationality').value.trim(),
    idNumber: id,
    licenseNumber: document.getElementById('licenseNumber').value.trim(),
    licenseExpiry: document.getElementById('licenseExpiry').value,
    branchNumber: document.getElementById('branchNumber').value.trim(),
    mobile: document.getElementById('mobile').value.trim(),
    workHours: document.getElementById('workHours').value.trim(),
    updatedAt: serverTimestamp()
  };

  if(!id || !data.fullName || !data.branchNumber || !data.mobile){
    showMsg(t.errRequired_pharmacist, false);
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = t.saving;

  try{
    await setDoc(doc(db, 'pharmacists', id), data);
    showMsg(t.successMsg, true);
  } catch(e){
    showMsg(t.errPrefix + e.message, false);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = t.saveBtn;
  }
});
</script>
</body>
</html>
