<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات الصيادلة — صيدلية معاذ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">→ رجوع للرئيسية</a>

  <div class="topbar">
    <div class="cap-badge">💊</div>
    <div class="titles">
      <span class="brand">صيدلية معاذ</span>
      <h1 class="page-title">بيانات الصيادلة</h1>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">تسجيل / تحديث البيانات</div>
    <div class="hint" style="margin-bottom:16px">لو سبق وسجلت بياناتك، وابعتها تاني بنفس رقم الهوية، هتستبدل القديمة تلقائي بالجديدة.</div>

    <label>الاسم رباعي</label>
    <input type="text" id="fullName" placeholder="الاسم الأول الأب الجد العائلة">

    <div class="field-row">
      <div>
        <label>الجنسية</label>
        <input type="text" id="nationality" placeholder="مثال: سعودي">
      </div>
      <div>
        <label>رقم الفرع</label>
        <input type="text" id="branchNumber" inputmode="numeric" placeholder="مثال: 29">
      </div>
    </div>

    <label>رقم الهوية / الإقامة</label>
    <input type="text" id="idNumber" inputmode="numeric" placeholder="مثال: 1023456789">

    <label>رقم التسجيل المهني</label>
    <input type="text" id="licenseNumber" placeholder="رقم التسجيل المهني">

    <label>تاريخ انتهاء التسجيل المهني</label>
    <input type="date" id="licenseExpiry">

    <label>رقم الجوال</label>
    <input type="tel" id="mobile" placeholder="05XXXXXXXX">

    <div class="actions">
      <button class="btn btn-primary btn-block" id="saveBtn">حفظ البيانات</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </div>

</div>

<script type="module">
import { db, doc, setDoc, serverTimestamp } from "./firebase-config.js";

const formMsg = document.getElementById('formMsg');

function showMsg(text, ok){
  formMsg.textContent = text;
  formMsg.className = 'msg show ' + (ok ? 'ok' : 'err');
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const id = document.getElementById('idNumber').value.trim();
  const data = {
    fullName: document.getElementById('fullName').value.trim(),
    nationality: document.getElementById('nationality').value.trim(),
    idNumber: id,
    licenseNumber: document.getElementById('licenseNumber').value.trim(),
    licenseExpiry: document.getElementById('licenseExpiry').value,
    branchNumber: document.getElementById('branchNumber').value.trim(),
    mobile: document.getElementById('mobile').value.trim(),
    updatedAt: serverTimestamp()
  };

  if(!id || !data.fullName || !data.branchNumber || !data.mobile){
    showMsg('من فضلك املا على الأقل: رقم الهوية، الاسم، رقم الفرع، رقم الجوال', false);
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'جاري الحفظ...';

  try{
    await setDoc(doc(db, 'pharmacists', id), data);
    showMsg('تم حفظ بياناتك بنجاح ✓', true);
  } catch(e){
    showMsg('حصل خطأ أثناء الحفظ: ' + e.message, false);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = 'حفظ البيانات';
  }
});
</script>
</body>
</html>
