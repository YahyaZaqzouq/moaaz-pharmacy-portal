<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بيانات العمال — صيدلية معاذ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html">→ رجوع للرئيسية</a>

  <div class="topbar">
    <div class="cap-badge">🧑‍💼</div>
    <div class="titles">
      <span class="brand">صيدلية معاذ</span>
      <h1 class="page-title">بيانات العمال</h1>
    </div>
  </div>

  <div class="card">
    <div class="eyebrow">تسجيل / تحديث البيانات</div>
    <div class="hint" style="margin-bottom:16px">لو سبق وسجلت بياناتك، وابعتها تاني بنفس رقم الهوية، هتستبدل القديمة تلقائي بالجديدة.</div>

    <label>الاسم رباعي</label>
    <input type="text" id="fullName" placeholder="الاسم الأول الأب الجد العائلة">

    <label>رقم الهوية / الإقامة</label>
    <input type="text" id="idNumber" inputmode="numeric" placeholder="مثال: 1023456789">

    <div class="field-row">
      <div>
        <label>تاريخ انتهاء الهوية / الإقامة</label>
        <input type="date" id="idExpiry">
      </div>
      <div>
        <label>رقم الفرع</label>
        <input type="text" id="branchNumber" inputmode="numeric" placeholder="مثال: 29">
      </div>
    </div>

    <label>رقم الجوال</label>
    <input type="tel" id="mobile" placeholder="05XXXXXXXX">

    <label>الكفالة</label>
    <select id="sponsor">
      <option value="">اختر الكفالة</option>
      <option value="معاذ">معاذ</option>
      <option value="شمائل الحجاز">شمائل الحجاز</option>
      <option value="اخر">أخرى</option>
    </select>

    <div id="sponsorOtherWrap" style="display:none">
      <label>اسم الكفيل</label>
      <input type="text" id="sponsorOther" placeholder="اكتب اسم الكفيل">
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-block" id="saveBtn">حفظ البيانات</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </div>

</div>

<script type="module">
import { db, doc, setDoc, serverTimestamp } from "./firebase-config.js";

const formMsg = document.getElementById('formMsg');
const sponsorSelect = document.getElementById('sponsor');
const sponsorOtherWrap = document.getElementById('sponsorOtherWrap');

function showMsg(text, ok){
  formMsg.textContent = text;
  formMsg.className = 'msg show ' + (ok ? 'ok' : 'err');
}

sponsorSelect.addEventListener('change', () => {
  sponsorOtherWrap.style.display = sponsorSelect.value === 'اخر' ? 'block' : 'none';
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const id = document.getElementById('idNumber').value.trim();
  const sponsor = sponsorSelect.value;
  const data = {
    fullName: document.getElementById('fullName').value.trim(),
    idNumber: id,
    idExpiry: document.getElementById('idExpiry').value,
    branchNumber: document.getElementById('branchNumber').value.trim(),
    mobile: document.getElementById('mobile').value.trim(),
    sponsor: sponsor,
    sponsorOther: sponsor === 'اخر' ? document.getElementById('sponsorOther').value.trim() : '',
    updatedAt: serverTimestamp()
  };

  if(!id || !data.fullName || !data.branchNumber || !data.mobile || !sponsor){
    showMsg('من فضلك املا على الأقل: رقم الهوية، الاسم، رقم الفرع، رقم الجوال، الكفالة', false);
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = 'جاري الحفظ...';

  try{
    await setDoc(doc(db, 'workers', id), data);
    showMsg('تم حفظ بياناتك بنجاح ✓', true);
  } catch(e){
    showMsg('حصل خطأ أثناء الحفظ: ' + e.message, false);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = 'حفظ البيانات';
  }
});
</script>
</body>
</html>
