<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_worker">بيانات العمال — صيدلية معاذ</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html" data-i18n="backLink">→ رجوع للرئيسية</a>

  <div class="topbar">
    <img src="logo.jpg" alt="Moaz Pharmacy" class="logo-img">
    <div class="titles">
      <h1 class="page-title" data-i18n="pageHeading_worker">بيانات العمال</h1>
    </div>
    <button class="lang-toggle" id="langToggle">English</button>
  </div>

  <div class="card">
    <div class="eyebrow" data-i18n="formEyebrow">تسجيل / تحديث البيانات</div>
    <div class="hint" data-i18n="hint_resubmit" style="margin-bottom:16px">لو سبق وسجلت بياناتك، وابعتها تاني بنفس رقم الهوية، هتستبدل القديمة تلقائي بالجديدة.</div>

    <label data-i18n="label_fullName">الاسم رباعي</label>
    <input type="text" id="fullName" data-i18n-placeholder="ph_fullName" placeholder="الاسم الأول الأب الجد العائلة">

    <label data-i18n="label_idNumber">رقم الهوية / الإقامة</label>
    <input type="text" id="idNumber" inputmode="numeric" data-i18n-placeholder="ph_idNumber" placeholder="مثال: 1023456789">

    <div class="field-row">
      <div>
        <label data-i18n="label_idExpiry">تاريخ انتهاء الهوية / الإقامة</label>
        <input type="date" id="idExpiry">
      </div>
      <div>
        <label data-i18n="label_branchNumber">رقم الفرع</label>
        <input type="text" id="branchNumber" inputmode="numeric" data-i18n-placeholder="ph_branchNumber" placeholder="مثال: 29">
      </div>
    </div>

    <label data-i18n="label_mobile">رقم الجوال</label>
    <input type="tel" id="mobile" data-i18n-placeholder="ph_mobile" placeholder="05XXXXXXXX">

    <label data-i18n="label_sponsor">الكفالة</label>
    <select id="sponsor">
      <option value="" data-i18n="sponsor_placeholder">اختر الكفالة</option>
      <option value="معاذ" data-i18n="sponsor_moaz">معاذ</option>
      <option value="شمائل الحجاز" data-i18n="sponsor_shamail">شمائل الحجاز</option>
      <option value="اخر" data-i18n="sponsor_other">أخرى</option>
    </select>

    <div id="sponsorOtherWrap" style="display:none">
      <label data-i18n="label_sponsorOther">اسم الكفيل</label>
      <input type="text" id="sponsorOther" data-i18n-placeholder="ph_sponsorOther" placeholder="اكتب اسم الكفيل">
    </div>

    <div class="actions">
      <button class="btn btn-primary btn-block" id="saveBtn" data-i18n="saveBtn">حفظ البيانات</button>
    </div>
    <div class="msg" id="formMsg"></div>
  </div>

</div>

<script type="module">
import { db, doc, setDoc, serverTimestamp } from "./firebase-config.js";
import { initLangToggle, getLang, dict } from "./i18n.js";

initLangToggle();

const formMsg = document.getElementById('formMsg');
const sponsorSelect = document.getElementById('sponsor');
const sponsorOtherWrap = document.getElementById('sponsorOtherWrap');

function showMsg(text, ok){
  formMsg.textContent = text;
  formMsg.className = 'msg show ' + (ok ? 'ok' : 'err');
}

sponsorSelect.addEventListener('change', () => {
  sponsorOtherWrap.style.display = sponsorSelect.value === 'اخر' ? 'block' : 'none';
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const lang = getLang();
  const t = dict[lang];
  const id = document.getElementById('idNumber').value.trim();
  const sponsor = sponsorSelect.value;
  const data = {
    fullName: document.getElementById('fullName').value.trim(),
    idNumber: id,
    idExpiry: document.getElementById('idExpiry').value,
    branchNumber: document.getElementById('branchNumber').value.trim(),
    mobile: document.getElementById('mobile').value.trim(),
    sponsor: sponsor,
    sponsorOther: sponsor === 'اخر' ? document.getElementById('sponsorOther').value.trim() : '',
    updatedAt: serverTimestamp()
  };

  document.querySelectorAll('.field-error').forEach(el => el.classList.remove('field-error'));

  const requiredIds = ['idNumber','fullName','idExpiry','branchNumber','mobile','sponsor'];
  const missing = requiredIds.filter(rid => !document.getElementById(rid).value.trim())
    .map(rid => document.getElementById(rid));
  if(sponsor === 'اخر' && !document.getElementById('sponsorOther').value.trim()){
    missing.push(document.getElementById('sponsorOther'));
  }

  if(missing.length > 0){
    showMsg(t.errRequired_worker, false);
    missing.forEach(el => el.classList.add('field-error'));
    missing[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }

  const saveBtn = document.getElementById('saveBtn');
  saveBtn.disabled = true; saveBtn.textContent = t.saving;

  try{
    await setDoc(doc(db, 'workers', id), data);
    showMsg(t.successMsg, true);
  } catch(e){
    showMsg(t.errPrefix + e.message, false);
  } finally {
    saveBtn.disabled = false; saveBtn.textContent = t.saveBtn;
  }
});

document.querySelector('.card').addEventListener('input', (e) => {
  if(e.target.classList.contains('field-error') && e.target.value.trim()) e.target.classList.remove('field-error');
});
document.querySelector('.card').addEventListener('change', (e) => {
  if(e.target.classList.contains('field-error') && e.target.value.trim()) e.target.classList.remove('field-error');
});
</script>
</body>
</html>
