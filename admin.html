<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title_admin">لوحة تحكم المسؤول — صيدلية معاذ</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
<div class="wrap">
  <a class="back-link" href="index.html" data-i18n="backLink">→ رجوع للرئيسية</a>

  <div class="topbar">
    <img src="assets/logo.jpg" alt="Moaz Pharmacy" class="logo-img">
    <div class="titles">
      <h1 class="page-title" data-i18n="pageHeading_admin">لوحة تحكم المسؤول</h1>
    </div>
    <span class="login-badge" id="loginBadge" style="display:none"><span class="dot"></span><span id="loginBadgeText"></span></span>
    <button class="lang-toggle" id="langToggle">English</button>
  </div>

  <!-- تسجيل الدخول -->
  <div class="card" id="loginCard">
    <div class="eyebrow" data-i18n="loginEyebrow">تسجيل دخول المسؤول</div>
    <label for="email" data-i18n="label_email">البريد الإلكتروني</label>
    <input type="text" id="email" placeholder="admin@example.com">
    <label for="password" data-i18n="label_password">كلمة المرور</label>
    <input type="text" id="password" data-i18n-placeholder="label_password" placeholder="كلمة المرور" autocomplete="off" style="-webkit-text-security: disc;">
    <div class="actions">
      <button class="btn btn-primary btn-block" id="loginBtn" data-i18n="loginBtn">دخول</button>
    </div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- لوحة التحكم -->
  <div id="dashboard" style="display:none">

    <div class="stat-row">
      <div class="stat"><div class="num" id="statPharm">—</div><div class="lbl" data-i18n="statPharm">عدد الصيادلة</div></div>
      <div class="stat"><div class="num" id="statWork">—</div><div class="lbl" data-i18n="statWork">عدد العمال</div></div>
      <div class="stat"><div class="num" id="statBranches">—</div><div class="lbl" data-i18n="statBranches">عدد الفروع المختلفة</div></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="pharmacists" data-i18n="tab_pharmacists">الصيادلة</div>
      <div class="tab" data-tab="workers" data-i18n="tab_workers">العمال</div>
    </div>

    <div class="toolbar">
      <input type="text" id="searchBox" data-i18n-placeholder="searchPlaceholder" placeholder="بحث بالاسم أو رقم الفرع...">
      <button class="btn btn-ghost" id="exportBtn" data-i18n="exportBtn">تصدير Excel</button>
      <button class="btn btn-ghost" id="refreshBtn" data-i18n="refreshBtn">تحديث</button>
      <button class="btn btn-ghost" id="logoutBtn" data-i18n="logoutBtn">خروج</button>
    </div>

    <div class="table-scroll">
      <table id="dataTable">
        <thead><tr id="tableHead"></tr></thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>

    <div class="empty-state" id="emptyState" style="display:none">
      <div class="icon">📭</div>
      <span data-i18n="emptyState">لا توجد بيانات لعرضها بعد</span>
    </div>
  </div>

</div>

<script type="module">
import {
  db, auth, collection, getDocs,
  signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "./firebase-config.js";
import { initLangToggle, getLang, dict } from "./i18n.js";

const currentLang = initLangToggle();
// إعادة تطبيق الترجمة بعد أي تبديل لغة أثناء الاستخدام
document.getElementById('langToggle').addEventListener('click', () => {
  renderTable();
});

const loginCard = document.getElementById('loginCard');
const dashboard = document.getElementById('dashboard');
const loginMsg = document.getElementById('loginMsg');

let currentTab = 'pharmacists';
let pharmacistsData = [];
let workersData = [];

function columns(){
  const t = dict[getLang()];
  return {
    pharmacists: [
      ['fullName', t.col_fullName], ['nationality', t.col_nationality], ['idNumber', t.col_idNumber],
      ['licenseNumber', t.col_licenseNumber], ['licenseExpiry', t.col_licenseExpiry],
      ['branchNumber', t.col_branchNumber], ['mobile', t.col_mobile], ['workHours', t.col_workHours]
    ],
    workers: [
      ['fullName', t.col_fullName], ['idNumber', t.col_idNumber], ['idExpiry', t.col_idExpiry],
      ['branchNumber', t.col_branchNumber], ['mobile', t.col_mobile], ['sponsor', t.col_sponsor], ['sponsorOther', t.col_sponsorOther]
    ]
  };
}

document.getElementById('loginBtn').addEventListener('click', async () => {
  const t = dict[getLang()];
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  loginMsg.className = 'msg';
  try{
    await signInWithEmailAndPassword(auth, email, password);
  } catch(e){
    loginMsg.textContent = t.loginError;
    loginMsg.className = 'msg show err';
  }
});

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, async (user) => {
  if(user){
    loginCard.style.display = 'none';
    dashboard.style.display = 'block';
    const t = dict[getLang()];
    document.getElementById('loginBadgeText').textContent = t.loggedInPrefix + ' ' + user.email;
    document.getElementById('loginBadge').style.display = 'inline-flex';
    await loadData();
    renderTable();
  } else {
    loginCard.style.display = 'block';
    dashboard.style.display = 'none';
    document.getElementById('loginBadge').style.display = 'none';
  }
});

async function loadData(){
  const [pSnap, wSnap] = await Promise.all([
    getDocs(collection(db, 'pharmacists')),
    getDocs(collection(db, 'workers'))
  ]);
  pharmacistsData = pSnap.docs.map(d => d.data());
  workersData = wSnap.docs.map(d => d.data());

  document.getElementById('statPharm').textContent = pharmacistsData.length;
  document.getElementById('statWork').textContent = workersData.length;
  const branches = new Set([...pharmacistsData, ...workersData].map(r => r.branchNumber).filter(Boolean));
  document.getElementById('statBranches').textContent = branches.size;
}

document.getElementById('refreshBtn').addEventListener('click', async () => {
  await loadData();
  renderTable();
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.getElementById('searchBox').value = '';
    renderTable();
  });
});

document.getElementById('searchBox').addEventListener('input', renderTable);

function currentData(){
  const raw = currentTab === 'pharmacists' ? pharmacistsData : workersData;
  const q = document.getElementById('searchBox').value.trim();
  if(!q) return raw;
  return raw.filter(r =>
    (r.fullName || '').includes(q) || String(r.branchNumber || '').includes(q)
  );
}

function renderTable(){
  const cols = columns()[currentTab];
  const data = currentData();

  const head = document.getElementById('tableHead');
  head.innerHTML = cols.map(([,label]) => `<th>${label}</th>`).join('');

  const body = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');

  if(data.length === 0){
    body.innerHTML = '';
    emptyState.style.display = 'block';
    document.getElementById('dataTable').style.display = 'none';
    return;
  }

  emptyState.style.display = 'none';
  document.getElementById('dataTable').style.display = 'table';

  body.innerHTML = data.map(row =>
    '<tr>' + cols.map(([key]) => `<td>${row[key] ?? ''}</td>`).join('') + '</tr>'
  ).join('');
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const t = dict[getLang()];
  const cols = columns()[currentTab];
  const data = currentData();
  const rows = data.map(row => {
    const obj = {};
    cols.forEach(([key,label]) => { obj[label] = row[key] ?? ''; });
    return obj;
  });
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  const sheetName = currentTab === 'pharmacists' ? t.sheetName_pharmacists : t.sheetName_workers;
  XLSX.utils.book_append_sheet(wb, ws, sheetName);
  const fileName = (currentTab === 'pharmacists' ? t.fileName_pharmacists : t.fileName_workers) + '.xlsx';
  XLSX.writeFile(wb, fileName);
});
</script>
</body>
</html>
